name: Verify Gemini Connection (No Messages)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Check Gemini API without sending messages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python verify_gemini_connection.py
