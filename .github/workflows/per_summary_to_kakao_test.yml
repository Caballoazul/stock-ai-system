name: PER Summary to Kakao Test (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  per-summary-to-kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Read latest Gmail PER summary and send Kakao only
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import email
          import imaplib
          import os
          import re
          from datetime import datetime, timedelta, timezone
          from email import policy
          from email.header import decode_header, make_header
          from email.utils import parsedate_to_datetime, parseaddr
          from kakao_sender import send_kakao_messages

          address = os.environ['GMAIL_ADDRESS'].strip()
          password = os.environ['GMAIL_APP_PASSWORD'].replace(' ', '')
          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=48)
          client = imaplib.IMAP4_SSL('imap.gmail.com', 993, timeout=30)
          selected = None
          try:
              client.login(address, password)
              status, _ = client.select('INBOX', readonly=True)
              if status != 'OK':
                  raise RuntimeError('Gmail inbox unavailable')
              status, data = client.uid('search', None, 'SINCE', cutoff.strftime('%d-%b-%Y'))
              if status != 'OK':
                  raise RuntimeError('Gmail search failed')
              for uid in reversed((data[0] or b'').split()[-300:]):
                  status, items = client.uid('fetch', uid, '(BODY.PEEK[])')
                  if status != 'OK':
                      continue
                  raw = next((item[1] for item in items if isinstance(item, tuple) and isinstance(item[1], bytes)), None)
                  if not raw:
                      continue
                  msg = email.message_from_bytes(raw, policy=policy.default)
                  subject = str(make_header(decode_header(msg.get('Subject', ''))))
                  if not subject.startswith('[GitHub PER 단독 실측 테스트]'):
                      continue
                  if parseaddr(msg.get('From', ''))[1].lower() != address.lower():
                      continue
                  try:
                      received = parsedate_to_datetime(msg.get('Date')).astimezone(timezone.utc)
                  except (TypeError, ValueError):
                      continue
                  if not cutoff <= received <= now + timedelta(minutes=2):
                      continue
                  part = msg.get_body(preferencelist=('plain',))
                  body = part.get_content() if part else ''
                  if '[3사 PER 비교' not in body:
                      continue
                  if selected is None or received > selected[0]:
                      selected = (received, subject, body)
          finally:
              client.logout()

          if selected is None:
              raise RuntimeError('Recent PER test email not found')
          _, subject, body = selected
          rows = {}
          for name in ('마이크론', '삼성전자', 'SK하이닉스'):
              matches = [line.strip() for line in body.splitlines() if line.strip().startswith(name + ' |')]
              if len(matches) != 1:
                  raise RuntimeError('Missing or duplicate PER row: ' + name)
              cells = [c.strip() for c in matches[0].split('|')]
              if len(cells) != 4:
                  raise RuntimeError('Invalid PER row: ' + name)
              rows[name] = cells
          stamp = re.search(r'수집/작성:\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2}) KST', body)
          if not stamp:
              raise RuntimeError('Collection timestamp missing')
          date = datetime.strptime(stamp.group(1), '%Y-%m-%d %H:%M')
          def fmt(value):
              return value.replace('배', '').strip()
          message = (
              f"[3단계 테스트] 반도체 PER ({date:%m/%d %H:%M} KST)\n"
              f"마이크론 T:{fmt(rows['마이크론'][1])} F:{fmt(rows['마이크론'][2])}\n"
              f"삼성전자 T:{fmt(rows['삼성전자'][1])} F:{fmt(rows['삼성전자'][2])}\n"
              f"SK하이닉스 T:{fmt(rows['SK하이닉스'][1])} F:{fmt(rows['SK하이닉스'][2])}\n"
              "T=Trailing, F=Forward (배)\n"
              "출처: Yahoo/yfinance·Gmail 원본\n"
              "EPS 기간 미검증"
          )
          if len(message) > 180:
              raise RuntimeError(f'Kakao message too long: {len(message)}')
          sent = send_kakao_messages([message])
          if sent != 1:
              raise RuntimeError('Expected exactly one Kakao message')
          print('GMAIL_PER_TO_KAKAO_TEST_OK')
          print('SOURCE_SUBJECT=' + subject)
          print('KAKAO_CHAR_COUNT=' + str(len(message)))
          PY
