name: Diagnose News Links (No Messages)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Diagnose Google News links without sending messages
        run: python diagnose_news_links.py
