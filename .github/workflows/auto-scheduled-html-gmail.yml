name: Auto Validate Scheduled HTML Briefing

on:
  push:
    branches:
      - main
    paths:
      - 'tests/chatgpt_scheduled_html_*.html'
      - 'tests/chatgpt_scheduled_briefing_*.html'

permissions:
  contents: read

concurrency:
  group: scheduled-html-auto-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-and-optional-send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram dependency
        run: python -m pip install requests yfinance==1.7.0
      - name: Process only newly added HTML reports
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SEND_ENABLED: ${{ vars.SCHEDULED_HTML_AUTOSEND_ENABLED }}
          CHANNEL_SEND_ENABLED: ${{ vars.SCHEDULED_HTML_CHANNELS_ENABLED }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            case "$file" in
              tests/chatgpt_scheduled_html_*.html|tests/chatgpt_scheduled_briefing_*.html)
                echo "Validating newly added report: $file"
                python send_saved_html.py --report "$file"
                python send_saved_html_channels.py --report "$file"
                if [[ "$SEND_ENABLED" == "true" && "$GITHUB_RUN_ATTEMPT" == "1" ]]; then
                  python send_saved_html.py --report "$file" --send
                  case "$file" in
                    tests/chatgpt_scheduled_briefing_am_*.html|tests/chatgpt_scheduled_briefing_pm_*.html)
                      python send_scheduled_telegram_per.py --report "$file" --send
                      ;;
                    *)
                      echo "TELEGRAM_SKIPPED: non-AM/PM test HTML"
                      ;;
                  esac
                else
                  echo "AUTOSEND_DISABLED_OR_RERUN: Gmail and Telegram not sent"
                fi
                echo "LEGACY_CHANNEL_AUTOSEND_SKIPPED: avoid duplicate Telegram/Kakao"
                count=$((count + 1))
                ;;
            esac
          done < <(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$GITHUB_SHA")
          echo "NEW_REPORTS_VALIDATED=$count"
          if [[ "$count" -eq 0 ]]; then
            echo "NO_NEW_HTML_REPORT: nothing to send"
          fi
