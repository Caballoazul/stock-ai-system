name: Export Market Analysis for GPT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Export market data
        run: python export_market_analysis.py
      - name: Commit JSON snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/market_analysis.json
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
          else
            git commit -m 'data: update market analysis snapshot'
            git push
          fi
