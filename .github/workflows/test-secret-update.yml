
name: Test Secret Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-secret-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret updater token
        env:
          GH_SECRET_UPDATE_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
        run: |
          if [ -z "$GH_SECRET_UPDATE_TOKEN" ]; then
            echo "ERROR: GH_SECRET_UPDATE_TOKEN is missing"
            exit 1
          fi
          echo "Updater token is configured"

      - name: Create test secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s' 'kakao-secret-test-20261017' |
            gh secret set KAKAO_SECRET_WRITE_TEST \
              --repo "$GH_REPO"

          echo "Test secret update request completed"

      - name: Verify secret metadata
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh secret list --repo "$GH_REPO" |
            grep '^KAKAO_SECRET_WRITE_TEST' ||
            {
              echo "ERROR: Test secret not found"
              exit 1
            }

          echo "Test secret metadata verified"


      - name: Verify stored secret value
        env:
          TEST_SECRET: ${{ secrets.KAKAO_SECRET_WRITE_TEST }}
        run: |
          if [ "$TEST_SECRET" = "kakao-secret-test-20261017" ]; then
            echo "PASS: Stored secret value verified"
          else
            echo "FAIL: Stored secret value mismatch"
            exit 1
          fi
