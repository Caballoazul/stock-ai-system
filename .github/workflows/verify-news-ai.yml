name: Verify News AI (No Messages)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-news-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Analyze one article without sending messages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_AI_MODEL: gemini-3.5-flash-lite
        run: python verify_news_ai.py
