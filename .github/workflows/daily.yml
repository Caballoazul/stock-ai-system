name: Daily Semiconductor Analysis

on:
  schedule:
    - cron: '0 23 * * 0-4'  # 08:00 KST, 월~금
    - cron: '30 7 * * 1-5'  # 16:30 KST, 월~금
    - cron: '30 11 * * 1-5' # 20:30 KST, 월~금
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semiconductor-daily-report
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Semiconductor Analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python main.py
