name: Send HTML Telegram Kakao One-Time Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SEND_ONCE to send one Telegram and one Kakao message'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: html-channels-one-time-test
  cancel-in-progress: false

jobs:
  send-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "SEND_ONCE" ]]; then
            echo "Confirmation must be SEND_ONCE" >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram dependency
        run: python -m pip install requests
      - name: Validate and send existing test HTML to Telegram and Kakao only
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python send_saved_html_channels.py --report tests/chatgpt_scheduled_html_delivery_20261020.html --send
